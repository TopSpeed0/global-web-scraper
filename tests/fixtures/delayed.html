<!doctype html><html><head><meta charset="utf-8"><title>Delayed</title></head><body>
<div id="list"></div>
<script>
setTimeout(function () {
  var list = document.getElementById('list');
  for (var i = 1; i <= 3; i++) { var d = document.createElement('div'); d.className = 'item'; d.textContent = 'Item ' + i; list.appendChild(d); }
}, 1500);
</script>
</body></html>
